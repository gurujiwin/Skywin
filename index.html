<script>
/* audio.js – procedural sound FX, no audio files (Web Audio API) */
if(!Array.prototype.at)Array.prototype.at=function(i){return this[i<0?this.length+i:i]};
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const SkywinAudio=(()=>{
  let c,out,eng,muted=false;try{muted=localStorage.sw_mute==='1'}catch(e){}
  const ac=()=>{if(!c){c=new(window.AudioContext||window.webkitAudioContext)();out=c.createGain();out.gain.value=.5;out.connect(c.destination)}
    if(c.state==='suspended')c.resume();return c};
  // generic oscillator blip: freq f (optionally sliding to f2), duration d, start delay t0
  const tone=(f,d,type='sine',v=.2,t0=0,f2)=>{if(muted)return;const a=ac(),o=a.createOscillator(),e=a.createGain(),t=a.currentTime+t0;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e);e.connect(out);o.start(t);o.stop(t+d+.02)};
  // white-noise burst with exponential decay, low-passed at `lp` Hz
  const noise=(d,v,lp)=>{if(muted)return;const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.exp(-5*i/n);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(out);s.start()};
  const EV=['pointerdown','touchstart','touchend','click','keydown'];
  const unlock=()=>{try{const a=ac();if(a.state==='running')EV.forEach(e=>removeEventListener(e,unlock,true))}catch(e){}};
  EV.forEach(e=>addEventListener(e,unlock,true));
  return{
    get muted(){return muted},
    toggle(){muted=!muted;try{localStorage.sw_mute=muted?'1':'0'}catch(e){}if(muted)this.engineStop();return muted},
    click(){tone(1400,.06,'sine',.15)},
    door(){tone(180,.15,'square',.15,0,90);tone(520,.2,'triangle',.12,.08)},hop(){tone(300,.12,'sine',.2,0,700)},
    flip(){noise(.08,.25,6000);tone(900,.05,'square',.08)},spin(){tone(400+Math.random()*600,.05,'sawtooth',.05)},
    horn(){tone(330,.5,'sawtooth',.18);tone(415,.5,'sawtooth',.18)},squawk(){tone(900,.25,'square',.14,0,300)},
    laser(){tone(1500,.4,'sawtooth',.14,0,120);noise(.3,.4,3000)},emerald(){tone(660,.2,'sine',.2);tone(990,.3,'sine',.15,.07)},
    ping(){tone(1760,.35,'sine',.18);tone(2637,.5,'sine',.1,.05)},            // mines diamond
    win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.3,'triangle',.22,i*.09))}, // C5 E5 G5 C6
    crash(){noise(.8,.7,2200)},
    bomb(){noise(.6,.9,400);tone(110,.5,'square',.4,0,28)},
    engineStart(){if(muted||eng)return;const a=ac(),o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
      o.type='sawtooth';o.frequency.value=70;f.type='lowpass';f.frequency.value=500;g.gain.value=.06;
      o.connect(f);f.connect(g);g.connect(out);o.start();eng=o},
    engineSet(m){if(eng)eng.frequency.setTargetAtTime(70+Math.min(m,50)*22,c.currentTime,.05)}, // pitch rises with multiplier
    engineStop(){if(eng){try{eng.stop()}catch(e){}eng=null}}
  };
})();
</script>

id=\"stage\">\n  <div class=\"track\" id=\"track\"><\/div>\n  <div class=\"msg\" id=\"msg\">Mode chuno aur PLAY dabao<\/div>\n<\/div>\n\n<div class=\"ctrl\">\n  <div class=\"amt\"><button id=\"minus\">−<\/button><input id=\"amt\" type=\"number\" inputmode=\"numeric\" value=\"10\" min=\"1\"><button id=\"plus\">+<\/button><\/div>\n  <div class=\"chips\">\n    <button class=\"chip\" data-q=\"10\">10<\/button><button class=\"chip\" data-q=\"50\">50<\/button><button class=\"chip\" data-q=\"100\">100<\/button><button class=\"chip\" data-q=\"500\">500<\/button>\n  <\/div>\n  <div class=\"dif\" id=\"dif\"><\/div>\n  <div class=\"main\" id=\"main\"><\/div>\n<\/div>\n\n<div class=\"hbar\">Meri bets<\/div>\n<div class=\"tbl\" id=\"tbl\"><\/div>\n\n<div class=\"ov\" id=\"ov\"><\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n"}};
const GAME_FN={};
GAME_FN.aviator=function(document,setInterval,setTimeout,requestAnimationFrame,parent,API){

const $=id=>document.getElementById(id);
const PW=parent.SkywinWallet;
const bindBal=o=>Object.defineProperty(o,'bal',{get:()=>PW.get(),set:v=>PW.set(v),enumerable:true,configurable:true});

const WAIT=6000, K=0.085, CRASH_SHOW=3000;
let S;try{S=JSON.parse(localStorage.wav||'null')}catch(e){S=null}
if(!S)S={bal:1000,hist:[],mine:[],round:1000};bindBal(S);
const save=()=>{try{localStorage.wav=JSON.stringify(S)}catch(e){}};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}

// ---------- Sound ----------
let AC=null,soundOn=true,eng=null;try{soundOn=localStorage.wg_snd!=='0'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='sine',vol=.15,when=0,slide){if(!soundOn||PW.muted())return;const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SND={
  tap:()=>beep(600,.06,'triangle',.12),
  bet:()=>{beep(660,.08,'square',.07);beep(990,.12,'square',.07,.08)},
  tick:()=>beep(900,.07,'square',.06),
  takeoff:()=>beep(150,.7,'sawtooth',.09,0,700),
  crash:()=>{beep(420,.5,'sawtooth',.12,0,60);beep(90,.5,'square',.1,.05,40)},
  coin:()=>{beep(988,.08,'square',.09);beep(1319,.15,'square',.09,.08);beep(1760,.3,'triangle',.1,.16)},
  win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.18,'triangle',.14,i*.1))
};
function engStart(){if(!soundOn||PW.muted())return;const a=ac();if(!a)return;engStop();const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=90;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();eng={o,g}}
function engUpd(m){if(eng&&AC)eng.o.frequency.setTargetAtTime(90+Math.min(m,25)*22,AC.currentTime,.1)}
function engStop(){if(eng){try{eng.o.stop()}catch(e){}eng=null}}
document.addEventListener('click',()=>ac(),{once:true});

// ---------- Game state ----------
let phase='wait',tWaitEnd=Date.now()+WAIT,flyStart=0,crashAt=2,m=1,crashT=0,tCrash=0,lastTickSec=-1;
const bets=[0,1].map(()=>({amt:10,state:'idle',auto:0}));
const genCrash=()=>{const u=Math.random();let c=0.96/(1-u);c=Math.max(1,Math.min(c,500));return Math.floor(c*100)/100};
const mAt=t=>Math.floor(Math.exp(K*t)*100)/100;

function startFly(){
  S.round++;phase='fly';flyStart=Date.now();crashAt=genCrash();m=1;
  bets.forEach(b=>{if(b.state==='ready')b.state='live'});
  SND.takeoff();engStart();
}
function doCrash(){
  phase='crash';m=crashAt;tCrash=Date.now();crashT=Math.log(crashAt)/K;engStop();SND.crash();
  S.hist.unshift(crashAt);S.hist=S.hist.slice(0,25);
  bets.forEach(b=>{if(b.state==='live'){S.mine.unshift({r:S.round,amt:b.amt,mult:null,win:0});b.state='idle'}});
  S.mine=S.mine.slice(0,30);save();renderHist();renderTbl();
}
function cashout(i,mult){
  const b=bets[i];if(b.state!=='live')return;
  const win=Math.floor(b.amt*mult);S.bal+=win;b.state='idle';
  S.mine.unshift({r:S.round,amt:b.amt,mult,win});S.mine=S.mine.slice(0,30);save();
  SND.coin();toast(`Cash out ${mult.toFixed(2)}x → +${win} 🪙`);renderBal();renderTbl();
}

// ---------- UI ----------
function panelHTML(i){return `
<div class="panel">
  <div>
    <div class="amt"><button data-d="-${i}">−</button><input id="amt${i}" type="number" inputmode="numeric" value="10" min="1"><button data-d="+${i}">+</button></div>
    <div class="chips">${[10,50,100,500].map(a=>`<button class="chip" data-q="${i}:${a}">${a}</button>`).join('')}</div>
    <div class="auto">Auto cash out <input id="auto${i}" type="number" step="0.01" placeholder="x"></div>
  </div>
  <button class="go" id="go${i}" data-go="${i}"></button>
</div>`}
$('panels').innerHTML=panelHTML(0)+panelHTML(1);
const amtVal=i=>Math.max(1,Math.min(100000,Math.floor(+$('amt'+i).value||0)));

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=b.dataset;
  if(t.d){const i=+t.d.slice(1);if(bets[i].state!=='idle')return;SND.tap();$('amt'+i).value=Math.max(1,amtVal(i)+(t.d[0]==='+'?10:-10))}
  else if(t.q){const[i,a]=t.q.split(':');if(bets[+i].state!=='idle')return;SND.tap();$('amt'+i).value=a}
  else if(t.go!==undefined)onGo(+t.go);
});
function onGo(i){
  const b=bets[i];
  if(b.state==='idle'){
    const a=amtVal(i);if(a>S.bal)return PW.need();
    b.amt=a;b.auto=+$('auto'+i).value||0;if(b.auto&&b.auto<1.01)b.auto=0;
    S.bal-=a;b.state='ready';SND.bet();save();renderBal();
  }else if(b.state==='ready'){S.bal+=b.amt;b.state='idle';SND.tap();save();renderBal()}
  else if(b.state==='live'&&phase==='fly')cashout(i,m);
}
const cache={};
function renderBtns(){
  bets.forEach((b,i)=>{
    const el=$('go'+i);let cls='go',html;
    if(b.state==='idle')html=`BET<small>${amtVal(i)} 🪙</small>`;
    else if(b.state==='ready'){cls+=' wait';html=`CANCEL<small>${phase==='wait'?'Round ka intezar':'Agle round ke liye'}</small>`}
    else{cls+=' cash';html=`CASH OUT<b>${Math.floor(b.amt*m)}</b><small>${m.toFixed(2)}x</small>`}
    const key=cls+html;if(cache[i]!==key){cache[i]=key;el.className=cls;el.innerHTML=html}
  });
}
function renderBal(){}
function renderHist(){$('hist').innerHTML=S.hist.length?S.hist.map(v=>`<span class="${v<2?'c1':v<10?'c2':'c3'}">${v.toFixed(2)}x</span>`).join(''):'<span style="color:var(--mut)">Abhi koi round nahi</span>'}
function renderTbl(){
  $('tbl').innerHTML='<div class="h"><div>Round</div><div>Bet</div><div>Cash out</div><div>Result</div></div>'+
   (S.mine.length?S.mine.slice(0,12).map(x=>`<div class="r"><div style="font-size:11.5px">#${x.r}</div><div>${x.amt}</div><div>${x.mult?x.mult.toFixed(2)+'x':'—'}</div><div class="${x.win?'win':'lose'}">${x.win?'+'+x.win:'-'+x.amt}</div></div>`).join(''):'<div class="empty">Abhi tak koi bet nahi lagayi.</div>');
}


// ---------- Canvas ----------
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0;
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',fit);fit();
function plane(x,y,ang,sc){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(sc,sc);
  ctx.fillStyle='#b91c1c';
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-18,-17);ctx.lineTo(-9,-17);ctx.lineTo(10,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-28,-11);ctx.lineTo(-21,-11);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.ellipse(0,0,24,7.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fecaca';ctx.beginPath();ctx.ellipse(9,-2,7,3.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-18,17);ctx.lineTo(-9,17);ctx.lineTo(10,0);ctx.closePath();ctx.fill();
  ctx.restore();
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  const pl=14,pb=22,pr=46,pt=34,gw=W-pl-pr,gh=H-pb-pt;
  ctx.strokeStyle='#1c1f2a';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pt+gh*i/4;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W,y);ctx.stroke()}
  // sunburst glow
  let t=phase==='fly'?(now-flyStart)/1000:phase==='crash'?crashT:0;
  const T=Math.max(8,t),Mx=Math.max(2,Math.exp(K*t));
  const X=tt=>pl+(tt/T)*gw, Y=mm=>pt+gh-((mm-1)/(Mx-1))*gh;
  if(t>0){
    const N=70,pts=[];
    for(let i=0;i<=N;i++){const tt=t*i/N;pts.push([X(tt),Y(Math.exp(K*tt))])}
    ctx.beginPath();ctx.moveTo(pts[0][0],pt+gh);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[N][0],pt+gh);ctx.closePath();
    const g=ctx.createLinearGradient(0,pt,0,pt+gh);g.addColorStop(0,'#e5053966');g.addColorStop(1,'#e5053908');ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle='#e50539';ctx.lineWidth=3;ctx.stroke();
    let [px,py]=pts[N];const [qx,qy]=pts[N-1];let ang=Math.atan2(py-qy,px-qx);
    let al=1;
    if(phase==='crash'){const k=(now-tCrash)/1000;px+=k*220;py-=k*140;al=Math.max(0,1-k*1.3)}
    ctx.globalAlpha=al;plane(px,py,ang,1);ctx.globalAlpha=1;
  }else{
    const bob=Math.sin(now/300)*2;plane(pl+30,pt+gh-8+bob,-0.05,1);
  }
}

// ---------- Main loop ----------
function loop(){
  const now=Date.now();
  if(phase==='wait'){
    const rem=tWaitEnd-now;
    if(rem<=0)startFly();
    else{
      const s=Math.ceil(rem/1000);if(s!==lastTickSec){lastTickSec=s;if(s<=3)SND.tick()}
      $('ovl').innerHTML=`<div class="sub" style="font-size:15px">Agla round shuru hone me</div><div class="big" style="font-size:46px">${(rem/1000).toFixed(1)}s</div><div class="bar"><i style="width:${rem/WAIT*100}%"></i></div><div class="sub">Abhi bet lagao ✈️</div>`;
    }
  }else if(phase==='fly'){
    const t=(now-flyStart)/1000;m=mAt(t);
    if(m>=crashAt)doCrash();
    else{
      bets.forEach((b,i)=>{if(b.state==='live'&&b.auto&&m>=b.auto)cashout(i,b.auto)});
      engUpd(m);
      $('ovl').innerHTML=`<div class="big">${m.toFixed(2)}x</div>`;
    }
  }
  if(phase==='crash'){
    $('ovl').innerHTML=`<div class="sub" style="font-size:15px;color:#ff4d6d;font-weight:800">FLEW AWAY!</div><div class="big crashed">${crashAt.toFixed(2)}x</div>`;
    if(now-tCrash>=CRASH_SHOW){phase='wait';tWaitEnd=now+WAIT;m=1;lastTickSec=-1}
  }
  renderBtns();draw(now);
  $('clockNow').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  requestAnimationFrame(loop);
}
renderBal();renderHist();renderTbl();loop();

// SKYWIN: leaving the game returns unsettled bets
API.refund=()=>{bets.forEach(b=>{if(b.state==='ready'){S.bal+=b.amt;b.state='idle'}})};

API.stop=engStop;
};
GAME_FN.wingo=function(document,setInterval,setTimeout,requestAnimationFrame,parent,API){

const PW=parent.SkywinWallet;
const bindBal=o=>Object.defineProperty(o,'bal',{get:()=>PW.get(),set:v=>PW.set(v),enumerable:true,configurable:true});

const LOCK=5, START=1000;
const CMAP={g:'#22c55e',r:'#ef4444',v:'#a855f7'};

try{S=JSON.parse(localStorage.wg2||'null')}catch(e){S=null}
if(!S)S={bal:START,m:{}};bindBal(S);
MODES.forEach(m=>{if(!S.m[m.k])S.m[m.k]={hist:[],mine:[]}});
const save=()=>{try{localStorage.wg2=JSON.stringify(S)}catch(e){}};
const R={};MODES.forEach(m=>R[m.k]={round:Math.floor(Date.now()/m.ms),bets:[]});
let mode='30S', hview='game', sheet={t:null,amt:10,mul:1}, lastL=-1;

// ---- Sound engine (WebAudio, koi file nahi chahiye) ----
let AC=null, soundOn=true;
try{soundOn=localStorage.wg_snd!=='0'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='sine',vol=.15,when=0,slide){

  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);

const SND={

  c.ctl.onclick=e=>{const b=e.target.closest('[data-z]');if(!b||!on||busy)return;busy=1;const z=+b.dataset.z,k=Math.floor(rnd()*3);A.hop();ui();
    gb.style.left=Z[z]+'%';gb.style.bottom='150px';gb.classList.add('s');gk.style.left=Z[k]+'%';
    to=setTimeout(()=>{if(z===k){A.bomb();gm.innerHTML='<span class="lose">Saved! Lost '+wager+'</span>';end()}
      else{step++;A.win();gm.innerHTML='<span class="win">GOAL! '+mu(step)+'x</span>';if(step===N){const w=Math.floor(wager*mu(step));end();c.pay(w)}else{busy=0;ui()}}
      setTimeout(reset,900)},650)};
  ui();return()=>{clearTimeout(to);if(on)c.refund(wager)};
}});
/* KENO */
R('keno',{mount(c){
  const pick=new Set,mu=(n,h)=>n===1?(h?3.2:0):(h<Math.ceil(n/2)?0:+(.7*Math.pow(2.4,h-Math.ceil(n/2)+1)).toFixed(2));let busy=0,iv;
  c.stage.innerHTML='<div class="msg" id="km">Max 10 numbers chuno</div><div class="pgt" id="kt"></div><div class="pkg">'+[...Array(40).keys()].map(i=>`<button data-n="${i+1}">${i+1}</button>`).join('')+'</div>';
  c.ctl.innerHTML='<button class="chip" data-a="q">🎲 Quick Pick</button><button class="chip" data-a="c">✖ Clear</button><button class="act">DRAW</button>';
  const g=c.stage,bs=[...g.querySelectorAll('.pkg button')],km=$$(g,'#km'),kt=$$(g,'#kt');
  const pt=()=>{const n=pick.size;kt.innerHTML=n?[...Array(n).keys()].map(h=>h+1).filter(h=>mu(n,h)).map(h=>`<span id="h${h}">${h} hit · ${mu(n,h)}x</span>`).join(''):''};
  const paint=()=>{bs.forEach((b,i)=>{b.className=pick.has(i+1)?'on':''});pt()};
  g.onclick=e=>{const b=e.target.closest('[data-n]');if(!b||busy)return;A.click();const n=+b.dataset.n;pick.has(n)?pick.delete(n):pick.size<10?pick.add(n):c.toast('Max 10');paint()};
  c.ctl.onclick=e=>{const q=e.target.closest('[data-a]');if(q&&!busy){A.click();pick.clear();if(q.dataset.a==='q')while(pick.size<5)pick.add(1+Math.floor(rnd()*40));paint();return}
    if(!e.target.closest('.act')||busy)return;if(!pick.size)return c.toast('Pehle numbers chuno');const a=c.bet();if(!a)return;busy=1;paint();
    const d=[];while(d.length<10){const n=1+Math.floor(rnd()*40);if(!d.includes(n))d.push(n)}let i=0,h=0;km.textContent='Drawing…';
    iv=setInterval(()=>{const n=d[i++],b=bs[n-1];if(pick.has(n)){h++;b.className='hit';A.ping()}else{b.className='miss';A.click()}
      if(i===10){clearInterval(iv);busy=0;const m=mu(pick.size,h),w=Math.floor(a*m);if(w){c.pay(w);km.innerHTML='<span class="win">'+h+' hits · '+m+'x · +'+w+'</span>'}else{A.crash();km.innerHTML='<span class="lose">'+h+' hits · lost '+a+'</span>'}
        const t=$$(g,'#h'+h);if(t)t.classList.add('on')}},260)};
  return()=>clearInterval(iv);
}});
/* LUCKY WHEEL */
R('wheel',{mount(c){
  const SEG=[0,1.2,0,1.5,0,2,0,1.2,0,3,0,1.5,0,2,0,5,0,1.2,0,0],N=SEG.length,ST=360/N,COL={0:'#1f2937',1.2:'#0ea5e9',1.5:'#10b981',2:'#a855f7',3:'#f59e0b',5:'#ef4444'};
  c.stage.innerHTML='<div class="felt" style="text-align:center"><div class="pgw"><div class="pp">▼</div><div class="hub">SKY</div><canvas id="wc" width="270" height="270"></canvas></div><div class="tot" id="wr">Spin to win up to 5x</div><div class="msg" id="wm"></div></div>';
  c.ctl.innerHTML='<button class="act">SPIN</button>';
  const cv=$$(c.stage,'#wc'),g=cv.getContext('2d'),wr=$$(c.stage,'#wr'),wm=$$(c.stage,'#wm');let busy=0,k=0,to;
  SEG.forEach((v,i)=>{const a0=-Math.PI/2+i*ST*Math.PI/180,a1=a0+ST*Math.PI/180;g.beginPath();g.moveTo(135,135);g.arc(135,135,132,a0,a1);g.fillStyle=COL[v];g.fill();g.strokeStyle='#0008';g.lineWidth=2;g.stroke();
    g.save();g.translate(135,135);g.rotate((a0+a1)/2+Math.PI/2);g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText(v?v+'x':'✖',0,-108);g.restore()});
  c.ctl.firstChild.onclick=()=>{if(busy)return;const a=c.bet();if(!a)return;busy=1;const i=Math.floor(rnd()*N),v=SEG[i];k++;wr.textContent='…';wm.textContent='';cv.style.transform='rotate('+(k*2880-(i+.5)*ST)+'deg)';let t=0;const tk=setInterval(()=>{A.spin();if(++t>32)clearInterval(tk)},130);
    to=setTimeout(()=>{busy=0;wr.textContent=v?v+'x':'Try again';if(v){const w=Math.floor(a*v);c.pay(w);wm.innerHTML='<span class="win">+'+w+'</span>'}else{A.crash();wm.innerHTML='<span class="lose">Lost '+a+'</span>'}},4300)};
  return()=>clearTimeout(to);
}});
/* ANDAR BAHAR */
R('andarbahar',{mount(c){
  c.stage.innerHTML='<div class="felt" style="text-align:center"><div class="tot">JOKER</div><div id="aj"><b class="pgc pgj" style="background:repeating-linear-gradient(45deg,#1e3a8a 0 6px,#172554 6px 12px);color:#fff">?</b></div><div class="abr"><b class="rd">ANDAR</b><div id="aa"></div></div><div class="abr"><b class="am">BAHAR</b><div id="ab"></div></div><div class="zones" style="grid-template-columns:1fr 1fr;margin-top:10px"><button class="zn zr on" data-z="a">Andar<br><small>1.9x</small></button><button class="zn za" data-z="b">Bahar<br><small>1.9x</small></button></div><div class="msg" id="am"></div></div>';
  c.ctl.innerHTML='<button class="act">DEAL</button>';
  const aj=$$(c.stage,'#aj'),aa=$$(c.stage,'#aa'),ab=$$(c.stage,'#ab'),am=$$(c.stage,'#am');let z='a',busy=0,iv;
  c.stage.onclick=e=>{const b=e.target.closest('[data-z]');if(!b||busy)return;A.click();z=b.dataset.z;chipSel(c.stage,'.zn',b)};
  c.ctl.firstChild.onclick=()=>{if(busy)return;const a=c.bet();if(!a)return;busy=1;aa.innerHTML=ab.innerHTML=am.textContent='';
    const deck=[];for(let r=0;r<13;r++)for(let s=0;s<4;s++)deck.push([r,s]);for(let i=51;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
    const jk=deck.pop();aj.innerHTML=cardH(jk[0],jk[1],'pgj');A.flip();let n=0,side='a';
    iv=setInterval(()=>{const d=deck.pop(),el=side==='a'?aa:ab;el.insertAdjacentHTML('beforeend',cardH(d[0],d[1]));A.flip();n++;
      if(d[0]===jk[0]){clearInterval(iv);busy=0;if(side===z){const w=Math.floor(a*1.9);c.pay(w);am.innerHTML='<span class="win">'+(side==='a'?'ANDAR':'BAHAR')+' wins +'+w+'</span>'}else{A.crash();am.innerHTML='<span class="lose">'+(side==='a'?'ANDAR':'BAHAR')+' wins · lost '+a+'</span>'}}
      side=side==='a'?'b':'a'},320)};
  return()=>clearInterval(iv);
}});
/* SCRATCH CARDS */
R('scratch',{mount(c){
  const T={Bronze:{v:[1.5,2,3],p:.45},Silver:{v:[3,5,10],p:.15},Gold:{v:[10,20,50,100],p:.02}};let tier='Bronze',on=0,cells=[],rev=0,wager=0,win=0;
  c.stage.innerHTML='<div class="felt" style="text-align:center"><div class="tot" id="st">Match 3 to win</div><div class="sg"></div><div class="msg" id="sm">Tier chuno aur BUY dabao</div></div>';
  c.ctl.innerHTML=Object.keys(T).map((k,i)=>`<button class="chip ${i?'':'on'}" data-t="${k}">${k}</button>`).join('')+'<button class="act">BUY</button><button class="chip" id="ra" hidden>Reveal all</button>';
  const sg=$$(c.stage,'.sg'),sm=$$(c.stage,'#sm'),act=$$(c.ctl,'.act'),ra=$$(c.ctl,'#ra');
  const build=()=>{sg.innerHTML=[...Array(9).keys()].map(i=>`<button data-i="${i}">?</button>`).join('')};build();
  const settle=()=>{on=0;ra.hidden=true;act.disabled=false;if(win){const w=Math.floor(wager*win);c.pay(w);sm.innerHTML='<span class="win">3 match '+win+'x · +'+w+'</span>';cells.forEach((v,i)=>{if(v===win)sg.children[i].classList.add('w')})}else{A.crash();sm.innerHTML='<span class="lose">No match · lost '+wager+'</span>'}};
  const open=i=>{const b=sg.children[i];if(b.classList.contains('rv'))return;b.textContent=cells[i]+'x';b.classList.add('rv');A.ping();if(++rev===9)settle()};
  c.ctl.onclick=e=>{const t=e.target.closest('[data-t]');if(t&&!on){A.click();tier=t.dataset.t;chipSel(c.ctl,'[data-t]',t);return}
    if(e.target.id==='ra'){cells.forEach((_,i)=>open(i));return}
    if(!e.target.closest('.act')||on)return;const a=c.bet();if(!a)return;wager=a;on=1;rev=0;act.disabled=true;ra.hidden=false;build();const V=T[tier].v;win=rnd()<T[tier].p?V[Math.floor(rnd()*V.length)]:0;
    const cnt={};const PL=V.concat([0.2,0.5,0.8,1.1,2.5,4,7].filter(d=>!V.includes(d))),pk=()=>{let v;do{v=PL[Math.floor(rnd()*PL.length)]}while(cnt[v]>=2||v===win);cnt[v]=(cnt[v]||0)+1;return v};cells=[];
    if(win){for(let i=0;i<3;i++)cells.push(win);cnt[win]=3}for(;cells.length<9;)cells.push(pk());for(let i=8;i>0;i--){const j=Math.floor(rnd()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}sm.textContent='Tiles par tap karke scratch karo'};
  sg.onclick=e=>{const b=e.target.closest('[data-i]');if(b&&on)open(+b.dataset.i)};
  return()=>{if(on){win?c.pay(Math.floor(wager*win)):0}};
}});

SkywinEngine.ids().forEach(i=>{if(!SkywinEngine.has(i))console.warn('Game not registered:',i)});
SkywinEngine.start();
})();
